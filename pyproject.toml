[project]
name = "supply-chain-atlas"
version = "2.0.0"
description = "Supply-chain event detection + investment-signal pipeline over SEC EDGAR and market data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
    "dbt-postgres>=1.10.2",
    "beautifulsoup4>=4.15.0",
    "kafka-python-ng>=2.2.3",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "joblib>=1.4",
    "yfinance>=0.2.50",
    "pyarrow>=17.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",          # FastAPI TestClient transport
]

# Local packages installed editable so every entrypoint (host CLI, Airflow
# container via PYTHONPATH, tests) imports the same code regardless of cwd.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "transform", "db", "events", "streaming", "ml", "nlp", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
